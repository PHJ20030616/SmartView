openapi: 3.0.3
info:
  title: SmartView AI API
  description: SmartView FastAPI AI 服务对 Spring Boot 暴露的 API 契约
  version: 1.0.0
  contact:
    name: SmartView AI Team
servers:
  - url: http://localhost:8000
    description: 本地开发环境

tags:
  - name: 健康检查
    description: 服务健康状态
  - name: 简历解析
    description: 简历文件解析和结构化
  - name: 画像分析
    description: 简历画像分析
  - name: 面试流程
    description: 面试问题生成和回答评估
  - name: 报告生成
    description: 面试报告生成

paths:
  /api/v1/health:
    get:
      tags:
        - 健康检查
      summary: AI 服务健康状态检查
      operationId: aiHealthCheck
      security: []
      responses:
        '200':
          description: 服务健康
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [UP, DOWN]
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/resume/parse:
    post:
      tags:
        - 简历解析
      summary: 解析简历 PDF
      description: 调用统一 LangGraph 流程解析文本型或扫描型中文 PDF。
      operationId: parseResume
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseResumeRequest'
      responses:
        '200':
          description: 解析成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResumeResponse'
        '401':
          description: 接口鉴权失败
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 请求参数校验失败
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: AI 服务鉴权配置缺失
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/profile/analyze:
    post:
      tags:
        - 画像分析
      summary: 生成方向画像分析
      operationId: analyzeProfile
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeProfileRequest'
      responses:
        '200':
          description: 处理成功。业务失败（画像不存在/未确认、LLM 服务异常等）同样返回 200，
            通过 AnalyzeProfileResponse.success=false 与 errorMessage 表达。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeProfileResponse'
        '401':
          description: 接口鉴权失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: AI 服务鉴权配置缺失等系统级错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/interview/stage-plan:
    post:
      tags:
        - 面试流程
      summary: 生成阶段计划
      operationId: generateStagePlan
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateStagePlanRequest'
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagePlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/interview/first-question:
    post:
      tags:
        - 面试流程
      summary: 生成首题
      operationId: generateFirstQuestion
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateFirstQuestionRequest'
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/interview/evaluate:
    post:
      tags:
        - 面试流程
      summary: 评估回答并生成候选池
      operationId: evaluateAnswer
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateAnswerRequest'
      responses:
        '200':
          description: 评估成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/interview/candidate-pool:
    post:
      tags:
        - 面试流程
      summary: 生成候选问题池
      description: 按 poolType 生成预生成候选池（同阶段换题+下一阶段入口）或追问候选池（基于回答评估事实）。
        候选池仅提供备选问题，不决定下一步；最终动作由 Spring Boot 的 StagePolicyEngine 决定。
      operationId: generateCandidatePool
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCandidatePoolRequest'
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCandidatePoolResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/interview/report:
    post:
      tags:
        - 报告生成
      summary: 生成面试报告
      operationId: generateReport
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReportRequest'
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 固定 API Key 认证

  headers:
    XTraceId:
      description: 链路追踪 ID，与请求头 X-Trace-Id 一致，用于跨服务关联日志
      schema:
        type: string
        format: uuid

  schemas:
    ContactInfo:
      type: object
      properties:
        phone:
          type: string
          nullable: true
          description: 手机号
        email:
          type: string
          nullable: true
          description: 邮箱
        location:
          type: string
          nullable: true
          description: 所在地

    EducationExperience:
      type: object
      properties:
        school:
          type: string
          nullable: true
          description: 学校名称
        degree:
          type: string
          nullable: true
          description: 学历
        major:
          type: string
          nullable: true
          description: 专业
        startDate:
          type: string
          nullable: true
          description: 开始日期，保留简历原始格式
        endDate:
          type: string
          nullable: true
          description: 结束日期，保留简历原始格式

    WorkExperience:
      type: object
      properties:
        company:
          type: string
          nullable: true
          description: 公司名称
        position:
          type: string
          nullable: true
          description: 职位名称
        startDate:
          type: string
          nullable: true
          description: 开始日期，保留简历原始格式
        endDate:
          type: string
          nullable: true
          description: 结束日期，保留简历原始格式
        description:
          type: string
          nullable: true
          description: 工作内容

    ProjectExperience:
      type: object
      properties:
        projectName:
          type: string
          nullable: true
          description: 项目名称
        role:
          type: string
          nullable: true
          description: 项目中的角色
        description:
          type: string
          nullable: true
          description: 项目描述
        techStack:
          type: array
          description: 使用的技术栈
          items:
            type: string

    ResumeStructuredData:
      type: object
      properties:
        candidateName:
          type: string
          nullable: true
          description: 候选人姓名
        contactInfo:
          allOf:
            - $ref: '#/components/schemas/ContactInfo'
          nullable: true
        education:
          type: array
          description: 教育经历
          items:
            $ref: '#/components/schemas/EducationExperience'
        workExperience:
          type: array
          description: 工作经历
          items:
            $ref: '#/components/schemas/WorkExperience'
        projectExperience:
          type: array
          description: 项目经历
          items:
            $ref: '#/components/schemas/ProjectExperience'
        skills:
          type: array
          description: 技能列表
          items:
            type: string
        rawText:
          type: string
          nullable: true
          description: 简历原文

    ParseResumeRequest:
      type: object
      required:
        - fileUrl
        - mimeType
        - traceId
      properties:
        fileUrl:
          type: string
          minLength: 1
          maxLength: 2083
          format: uri
          description: MinIO 预签名 URL
        mimeType:
          type: string
          enum: [application/pdf]
          description: 文件 MIME 类型
          example: application/pdf
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID

    ParseResumeResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 解析是否成功
        candidateName:
          type: string
          nullable: true
          description: 候选人姓名
        contactInfo:
          allOf:
            - $ref: '#/components/schemas/ContactInfo'
          nullable: true
        education:
          type: array
          description: 教育经历
          items:
            $ref: '#/components/schemas/EducationExperience'
        workExperience:
          type: array
          description: 工作经历
          items:
            $ref: '#/components/schemas/WorkExperience'
        projectExperience:
          type: array
          description: 项目经历
          items:
            $ref: '#/components/schemas/ProjectExperience'
        skills:
          type: array
          description: 技能列表
          items:
            type: string
        rawText:
          type: string
          nullable: true
          description: 简历原文
        errorMessage:
          type: string
          nullable: true
          description: 解析失败原因
    ErrorResponse:
      type: object
      title: ErrorResponse
      description: 跨服务接口统一错误响应。
      required:
        - error
        - message
        - traceId
      properties:
        error:
          type: string
          title: Error
        message:
          type: string
          title: Message
        traceId:
          type: string
          format: uuid
          title: Traceid

    AnalyzeProfileRequest:
      type: object
      required:
        - resumeProfileId
        - roleDirection
        - traceId
      properties:
        resumeProfileId:
          type: string
          description: 简历画像 ID
        roleDirection:
          type: string
          enum: [JAVA_BACKEND, AGENT_DEVELOPMENT]
          description: 面试方向
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID

    AnalyzeProfileResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 分析是否成功
        skillTags:
          type: array
          description: 技能标签
          items:
            type: object
            properties:
              skill:
                type: string
              level:
                type: string
                enum: [EXPERT, PROFICIENT, FAMILIAR, BASIC]
              source:
                type: string
                enum: [WORK, PROJECT, EDUCATION]
        projectGraph:
          type: object
          description: 项目关系图谱
          properties:
            projects:
              type: array
              items:
                type: object
                properties:
                  projectName:
                    type: string
                  techStack:
                    type: array
                    items:
                      type: string
                  responsibilities:
                    type: array
                    items:
                      type: string
                  highlights:
                    type: array
                    items:
                      type: string
        capabilityHints:
          type: object
          description: 能力线索
          properties:
            engineering:
              type: array
              items:
                type: string
            architecture:
              type: array
              items:
                type: string
            domain:
              type: array
              items:
                type: string
        riskPoints:
          type: array
          description: 风险点
          items:
            type: object
            properties:
              category:
                type: string
                enum: [VAGUE_DESCRIPTION, SHALLOW_DEPTH, OUTDATED_TECH, LACK_EVIDENCE]
              description:
                type: string
        suggestedTopics:
          type: array
          description: 建议面试主题
          items:
            type: string
        stageTargets:
          type: object
          description: 阶段覆盖目标
          properties:
            basic:
              type: array
              items:
                type: string
            project:
              type: array
              items:
                type: string
            scenario:
              type: array
              items:
                type: string
        errorMessage:
          type: string
          description: 分析失败原因
        modelName:
          type: string
          description: 生成该分析结果使用的模型名称
        modelVersion:
          type: string
          description: 模型版本或配置版本

    GenerateStagePlanRequest:
      type: object
      required:
        - profileAnalysisId
        - roleDirection
        - traceId
      properties:
        profileAnalysisId:
          type: string
          description: 画像分析 ID
        roleDirection:
          type: string
          enum: [JAVA_BACKEND, AGENT_DEVELOPMENT]
          description: 面试方向
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID

    StagePlanResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 生成是否成功
        stages:
          type: array
          description: 阶段列表
          items:
            type: object
            required:
              - stage
              - minQuestions
              - maxQuestions
              - topics
              - maxFollowUpDepth
            properties:
              stage:
                type: string
                enum: [BASIC, PROJECT, SCENARIO]
                description: 阶段名称
              minQuestions:
                type: integer
                description: 最小题量
              maxQuestions:
                type: integer
                description: 最大题量
              topics:
                type: array
                description: 必覆盖主题
                items:
                  type: string
              maxFollowUpDepth:
                type: integer
                description: 单主题最大追问深度
        totalMaxQuestions:
          type: integer
          description: 总题量上限
        errorMessage:
          type: string
          description: 生成失败原因

    GenerateFirstQuestionRequest:
      type: object
      required:
        - sessionId
        - roleDirection
        - stagePlan
        - resumeProfileId
        - profileVersion
        - traceId
      properties:
        sessionId:
          type: string
          description: 面试会话 ID
        roleDirection:
          type: string
          enum: [JAVA_BACKEND, AGENT_DEVELOPMENT]
          description: 面试方向，用于知识库/面经检索过滤与出题上下文
        stagePlan:
          type: object
          description: >
            阶段计划，由 Spring 端从画像分析确定性生成后原样透传（不透明 payload）。
            字段格式见 docs/interview-policy.md 2.2：
            {policy_version, total_min_questions, total_max_questions,
            stages: [{stage, min_questions, max_questions, required_topics, max_follow_up_depth, switch_conditions}]}。
            FastAPI 只需读取 BASIC 阶段的 required_topics 等用于出题上下文。
        resumeProfileId:
          type: string
          description: 简历画像 ID
        profileVersion:
          type: integer
          description: 简历画像版本号
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID

    QuestionResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 生成是否成功
        questionText:
          type: string
          description: 问题正文
        topic:
          type: string
          description: 问题主题，例如某个技术点、某个简历项目、某类业务场景，
            用于回写 interview_question.topic
        questionType:
          type: string
          enum: [OPENING, FOLLOW_UP, SWITCH_TOPIC, STAGE_ENTRY]
          description: 问题类型
        sourceType:
          type: string
          enum: [KNOWLEDGE_BASE, EXPERIENCE_CASE, RESUME_PROJECT, MIXED]
          description: 来源类型
        expectedPoints:
          type: array
          description: 期望回答要点
          items:
            type: string
        knowledgeRefs:
          type: array
          description: 引用的八股知识片段
          items:
            type: object
            properties:
              title:
                type: string
              category:
                type: string
              snippet:
                type: string
        caseRefs:
          type: array
          description: 引用的面经案例
          items:
            type: object
            properties:
              title:
                type: string
              scenario:
                type: string
              snippet:
                type: string
        errorMessage:
          type: string
          description: 生成失败原因

    EvaluateAnswerRequest:
      type: object
      required:
        - sessionId
        - questionId
        - answerText
        - roleDirection
        - questionText
        - sessionContext
        - traceId
      properties:
        sessionId:
          type: string
          description: 面试会话 ID
        questionId:
          type: string
          description: 问题 ID
        answerText:
          type: string
          description: 用户回答文本
        roleDirection:
          type: string
          enum: [JAVA_BACKEND, AGENT_DEVELOPMENT]
          description: 面试方向
        questionText:
          type: string
          description: 当前问题正文（评估对照依据之一）
        expectedPoints:
          type: array
          description: 当前问题期望回答要点（评估对照依据）
          items:
            type: string
        stagePlan:
          type: object
          description: 阶段计划（不透明 payload，用于追问深度门控，结构见 docs/interview-policy.md 2.2）
        sessionContext:
          type: object
          description: 会话上下文
          properties:
            currentStage:
              type: string
            currentTopic:
              type: string
            questionCount:
              type: integer
            stageCoverage:
              type: object
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID

    EvaluateAnswerResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 评估是否成功
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: 回答得分
        level:
          type: string
          enum: [GOOD, NORMAL, WEAK]
          description: 回答等级
        matchedPoints:
          type: array
          description: 已命中的要点
          items:
            type: string
        missingPoints:
          type: array
          description: 缺失要点
          items:
            type: string
        riskPoints:
          type: array
          description: 暴露的问题或风险
          items:
            type: object
            properties:
              category:
                type: string
              description:
                type: string
        followUpCandidates:
          type: array
          description: 追问候选池（0-2 道，结构复用 CandidatePoolItem，携带主题/阶段/期望要点供下一轮评估）
          items:
            $ref: '#/components/schemas/CandidatePoolItem'
        errorMessage:
          type: string
          description: 评估失败原因

    GenerateCandidatePoolRequest:
      type: object
      required:
        - sessionId
        - questionId
        - roleDirection
        - poolType
        - stagePlan
        - traceId
      properties:
        sessionId:
          type: string
          description: 面试会话 ID
        questionId:
          type: string
          description: 当前问题 ID，候选池归属的题目
        roleDirection:
          type: string
          enum: [JAVA_BACKEND, AGENT_DEVELOPMENT]
          description: 面试方向
        poolType:
          type: string
          enum: [PRE_GENERATED, FOLLOW_UP]
          description: 候选池类型：提问后预生成 / 回答后追问
        currentStage:
          type: string
          enum: [BASIC, PROJECT, SCENARIO]
          description: 当前阶段
        stagePlan:
          type: object
          description: 阶段计划（不透明 payload，Spring 端生成后原样透传，结构见 docs/interview-policy.md 2.2）
        stageCoverage:
          type: object
          description: 阶段覆盖度（不透明 payload，Spring 端维护，结构见 docs/interview-policy.md 2.3）
        sessionContext:
          type: object
          properties:
            currentTopic:
              type: string
            questionCount:
              type: integer
        evaluationFacts:
          type: object
          description: 回答评估事实，仅 FOLLOW_UP 池需要
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
            level:
              type: string
              enum: [GOOD, NORMAL, WEAK]
            matchedPoints:
              type: array
              items:
                type: string
            missingPoints:
              type: array
              items:
                type: string
            riskPoints:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                  description:
                    type: string
            answerText:
              type: string
            questionText:
              type: string
        historyTopics:
          type: array
          description: 最近已问主题，用于生成时避免重复
          items:
            type: string
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID

    CandidatePoolItem:
      type: object
      required:
        - questionText
        - topic
        - stage
        - candidateType
      properties:
        questionText:
          type: string
          description: 候选问题正文
        topic:
          type: string
          description: 问题主题
        stage:
          type: string
          enum: [BASIC, PROJECT, SCENARIO]
          description: 所属阶段
        candidateType:
          type: string
          enum: [SAME_STAGE_SWITCH, NEXT_STAGE_ENTRY, FOLLOW_UP]
          description: 候选类型：同阶段换题 / 下一阶段入口 / 追问
        sourceType:
          type: string
          enum: [KNOWLEDGE_BASE, EXPERIENCE_CASE, RESUME_PROJECT, MIXED]
          description: 来源类型
        expectedPoints:
          type: array
          description: 期望回答要点
          items:
            type: string
        targetPoint:
          type: string
          description: 目标考察点
        reason:
          type: string
          description: 生成原因（追问时说明依据，如缺失要点/风险点）

    GenerateCandidatePoolResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 生成是否成功
        candidates:
          type: array
          description: 候选问题数组（0-4 道）
          items:
            $ref: '#/components/schemas/CandidatePoolItem'
        errorMessage:
          type: string
          description: 生成失败原因

    GenerateReportRequest:
      type: object
      required:
        - sessionId
        - traceId
      properties:
        sessionId:
          type: string
          description: 面试会话 ID
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID

    ReportResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 生成是否成功
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 综合得分
        readinessLevel:
          type: string
          enum: [NOT_READY, NEEDS_PRACTICE, READY, WELL_PREPARED]
          description: 面试准备度等级
        roleFitScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 岗位匹配度得分
        summary:
          type: string
          description: 总体评价
        strengths:
          type: array
          description: 优势点
          items:
            type: string
        weaknesses:
          type: array
          description: 薄弱点
          items:
            type: string
        riskPoints:
          type: array
          description: 风险点
          items:
            type: string
        suggestions:
          type: array
          description: 学习建议
          items:
            type: object
            properties:
              topic:
                type: string
              reason:
                type: string
              resources:
                type: array
                items:
                  type: string
        coverage:
          type: object
          description: 覆盖情况
          properties:
            basicCoverage:
              type: number
              format: float
              description: 基础知识覆盖率
            projectCoverage:
              type: number
              format: float
              description: 项目经历覆盖率
            scenarioCoverage:
              type: number
              format: float
              description: 场景题覆盖率
        referenceAnswers:
          type: array
          description: 每题参考答案
          items:
            type: object
            required:
              - questionId
              - answerType
              - referenceContent
            properties:
              questionId:
                type: string
                description: 问题 ID
              answerType:
                type: string
                enum: [BASIC_KEY_POINTS, PROJECT_STRUCTURE, SCENARIO_FRAMEWORK]
                description: 答案类型
              referenceContent:
                type: string
                description: 参考答案正文
              keyPoints:
                type: array
                description: 关键要点
                items:
                  type: string
              tradeoffs:
                type: array
                description: 场景题中的权衡点
                items:
                  type: object
                  properties:
                    aspect:
                      type: string
                    options:
                      type: array
                      items:
                        type: string
        errorMessage:
          type: string
          description: 生成失败原因

  responses:
    BadRequest:
      description: 请求参数格式错误
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - traceId
            properties:
              error:
                type: string
              message:
                type: string
              traceId:
                type: string
                format: uuid

    InternalServerError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - traceId
            properties:
              error:
                type: string
              message:
                type: string
              traceId:
                type: string
                format: uuid
