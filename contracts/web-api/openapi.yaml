openapi: 3.0.3
info:
  title: SmartView Web API
  description: SmartView Spring Boot 后端对外暴露的 Web API 契约
  version: 1.0.0
  contact:
    name: SmartView Team
servers:
  - url: http://localhost:8080
    description: 本地开发环境

tags:
  - name: 认证
    description: 用户认证相关接口
  - name: 用户
    description: 用户信息管理
  - name: 简历
    description: 简历文件和画像管理
  - name: 面试
    description: 面试会话和问答
  - name: 报告
    description: 面试报告查询
  - name: 可观测
    description: LLM 调用观测（运维视图）

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags:
        - 健康检查
      summary: 服务健康状态检查
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users/me:
    get:
      tags:
        - 用户
      summary: 获取当前用户信息
      operationId: getCurrentUser
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/resumes:
    get:
      tags:
        - 简历
      summary: 查询简历历史列表
      description: >
        分页查询当前登录用户的简历文件历史，按上传时间倒序。
        已软删除的简历（deleted=1）不返回；只返回当前用户数据。
      operationId: listResumes
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: 每页条数，最大 50
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeFileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - 简历
      summary: 上传简历文件
      operationId: uploadResume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF 格式简历文件
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/resumes/{resumeFileId}:
    get:
      tags:
        - 简历
      summary: 获取简历文件信息
      operationId: getResumeFile
      parameters:
        - name: resumeFileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeFileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - 简历
      summary: 删除简历文件
      operationId: deleteResume
      parameters:
        - name: resumeFileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/resume-profiles/{profileId}:
    get:
      tags:
        - 简历
      summary: 获取简历画像
      operationId: getResumeProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - 简历
      summary: 更新简历画像
      operationId: updateResumeProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResumeProfileRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/resume-profiles/{profileId}/confirm:
    post:
      tags:
        - 简历
      summary: 确认简历画像
      operationId: confirmResumeProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/resume-profiles/{profileId}/vectorization:
    get:
      tags:
        - 简历
      summary: 查询简历向量入库状态
      operationId: getResumeVectorizationStatus
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeVectorizationStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/resume-profiles/{profileId}/vectorization/retry:
    post:
      tags:
        - 简历
      summary: 重试简历向量入库
      operationId: retryResumeVectorization
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 重试任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeVectorizationStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/profile-analyses:
    post:
      tags:
        - 画像分析
      summary: 触发或获取方向画像分析
      description: >
        幂等接口：用户选择面试方向后调用。
        已有同方向成功分析时直接返回；已有进行中任务时返回任务状态；
        分析失败时新建 PROFILE_ANALYZE 任务重新分析。
        创建任务前后端会校验简历向量已成功入库。
      operationId: ensureProfileAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProfileAnalysisRequest'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnalysisStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/profile-analyses/{profileId}:
    get:
      tags:
        - 画像分析
      summary: 查询画像分析状态
      description: 前端轮询画像分析状态，最多等待 60 秒；成功后才允许开始面试。
      operationId: getProfileAnalysisStatus
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
        - name: roleDirection
          in: query
          required: true
          schema:
            type: string
            enum: [JAVA_BACKEND, AGENT_DEVELOPMENT]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnalysisStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/profile-analyses/{profileId}/retry:
    post:
      tags:
        - 画像分析
      summary: 重试方向画像分析
      description: 画像分析失败时允许用户重试，重试期间不允许开始面试。
      operationId: retryProfileAnalysis
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
        - name: roleDirection
          in: query
          required: true
          schema:
            type: string
            enum: [JAVA_BACKEND, AGENT_DEVELOPMENT]
      responses:
        '200':
          description: 重试任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAnalysisStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/interview-sessions:
    get:
      tags:
        - 面试
      summary: 查询面试会话历史列表
      description: >
        分页查询当前登录用户的面试会话摘要，按创建时间倒序。
        已软删除的会话（deleted=1）不返回；只返回当前用户数据。
        每条摘要携带报告状态（reportId/reportStatus），供前端决定"查看报告"入口是否可用。
      operationId: listInterviewSessions
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: 每页条数，最大 50
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - 面试
      summary: 创建面试会话
      operationId: createInterviewSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewSessionRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/interview-sessions/{sessionId}:
    get:
      tags:
        - 面试
      summary: 获取面试会话详情
      operationId: getInterviewSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - 面试
      summary: 删除面试会话（软删除）
      description: >
        同一事务内级联软删除会话及其全部子记录（报告、参考答案、问题、回答、评估），
        删除后历史列表不再展示；已删除记录保留（deleted=1）作为审计信息。
      operationId: deleteInterviewSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/interview-sessions/{sessionId}/answers:
    post:
      tags:
        - 面试
      summary: 提交回答
      operationId: submitAnswer
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAnswerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/interview-sessions/{sessionId}/finish:
    post:
      tags:
        - 面试
      summary: 提前结束面试
      operationId: finishInterviewSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 结束成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/interview-sessions/{sessionId}/report:
    get:
      tags:
        - 报告
      summary: 获取面试报告
      operationId: getSessionReport
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports:
    get:
      tags:
        - 报告
      summary: 查询报告历史列表
      description: >
        分页查询当前登录用户的复盘报告摘要，按创建时间倒序。
        只返回当前用户数据；生成中/成功/失败的报告均展示（报告页自会轮询或重试）。
      operationId: listReports
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: 每页条数，最大 50
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReportListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/reports/{reportId}:
    get:
      tags:
        - 报告
      summary: 获取报告详情
      operationId: getReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reports/{reportId}/retry:
    post:
      tags:
        - 报告
      summary: 报告生成失败后重试
      operationId: retryReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 重试成功（非失败状态幂等返回现状）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/llm-calls:
    get:
      tags:
        - 可观测
      summary: 查询 LLM 调用记录
      description: >
        分页查询大模型调用日志，支持按场景、prompt 版本与时间区间过滤，
        并在同一响应中返回该过滤条件下的汇总统计（成功率、P95 延迟、token 合计）。
        这是跨用户的运维视图，仅对配置白名单内的用户名开放；
        未配置白名单时接口对所有人关闭。
      operationId: listLlmCalls
      parameters:
        - name: scene
          in: query
          required: false
          description: 调用场景，留空表示不过滤
          schema:
            type: string
            enum: [question_generate, evaluate, report_generate, profile_analyze, resume_parse]
        - name: promptVersion
          in: query
          required: false
          description: prompt 版本，留空表示不过滤
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 起始时间（含），ISO-8601，例如 2026-09-01T00:00:00
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 结束时间（不含），ISO-8601
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: 每页条数，最大 50
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmCallListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token 认证，格式为 Bearer <token>

  schemas:
    ApiResponse:
      type: object
      required:
        - code
        - message
        - traceId
        - timestamp
      properties:
        code:
          type: string
          description: 业务响应码
          example: "SUCCESS"
        message:
          type: string
          description: 响应消息
          example: "操作成功"
        traceId:
          type: string
          format: uuid
          description: 链路追踪 ID
        timestamp:
          type: string
          format: date-time
          description: 响应时间

    LlmCallListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LlmCallPage'

    LlmCallPage:
      type: object
      description: 调用记录分页结果（items 按调用时间倒序）
      required:
        - items
        - page
        - size
        - total
        - stats
      properties:
        items:
          type: array
          description: 当前页调用记录
          items:
            $ref: '#/components/schemas/LlmCallSummary'
        page:
          type: integer
          description: 当前页码，从 1 开始
        size:
          type: integer
          description: 每页条数
        total:
          type: integer
          format: int64
          description: 符合条件的总条数
        stats:
          $ref: '#/components/schemas/LlmCallStats'

    LlmCallStats:
      type: object
      description: 当前过滤条件下的汇总统计（覆盖全部匹配记录，不随分页变化）
      required:
        - totalCalls
        - successCalls
        - successRate
        - p95LatencyMs
        - totalTokens
      properties:
        totalCalls:
          type: integer
          format: int64
          description: 调用总次数
        successCalls:
          type: integer
          format: int64
          description: 成功次数
        successRate:
          type: number
          format: double
          description: 成功率，0~1，保留四位小数；无记录时为 0
        p95LatencyMs:
          type: integer
          description: P95 延迟（毫秒）；无记录时为 0
        totalTokens:
          type: integer
          format: int64
          description: token 合计

    LlmCallSummary:
      type: object
      description: 单条 LLM 调用记录（不包含提示词与响应全文）
      required:
        - id
        - scene
        - model
        - status
        - latencyMs
        - retryAttempt
        - createdAt
      properties:
        id:
          type: string
          description: 记录 ID
        traceId:
          type: string
          nullable: true
          description: 链路追踪 ID
        scene:
          type: string
          enum: [question_generate, evaluate, report_generate, profile_analyze, resume_parse]
          description: 调用场景
        provider:
          type: string
          description: 模型提供方
        model:
          type: string
          description: 模型名称
        promptKey:
          type: string
          nullable: true
          description: prompt 标识
