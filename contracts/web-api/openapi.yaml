          type: string
          enum: [GENERATING, SUCCESS, FAILED]
          description: 报告状态
        generatedAt:
          type: string
          format: date-time
          description: 生成时间

    ReportCoverage:
      type: object
      description: 三阶段覆盖率（0~1 比例）
      properties:
        basicCoverage:
          type: number
          format: double
          description: 基础题覆盖比例
        projectCoverage:
          type: number
          format: double
          description: 项目题覆盖比例
        scenarioCoverage:
          type: number
          format: double
          description: 场景题覆盖比例

    ReportSuggestion:
      type: object
      description: 单项学习建议
      properties:
        topic:
          type: string
          description: 建议主题
        reason:
          type: string
          description: 建议原因
        resources:
          type: array
          items:
            type: string
          description: 推荐资源

    AnswerTradeoff:
      type: object
      description: 场景题加权点（权衡维度与可选方案）
      properties:
        aspect:
          type: string
          description: 权衡维度
        options:
          type: array
          items:
            type: string
          description: 可选方案

    ReferenceAnswer:
      type: object
      required:
        - questionId
        - answerType
        - referenceContent
      properties:
        id:
          type: string
          description: 参考答案 ID
        questionId:
          type: string
          description: 对应问题 ID
        answerType:
          type: string
          enum: [BASIC_KEY_POINTS, PROJECT_STRUCTURE, SCENARIO_FRAMEWORK]
          description: 答案类型
        referenceContent:
          type: string
          description: 参考答案正文
        keyPoints:
          type: array
          items:
            type: string
          description: 关键要点
        tradeoffs:
          type: array
          description: 场景题中的权衡点
          items:
            $ref: '#/components/schemas/AnswerTradeoff'

  responses:
    BadRequest:
      description: 请求参数格式错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: 未登录或 Token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 无权限访问资源
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: 资源状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: 业务逻辑校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: 依赖服务不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
