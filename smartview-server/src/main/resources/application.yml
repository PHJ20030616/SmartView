server:
  port: ${SERVER_PORT:8080}
  tomcat:
    part:
      max-file-size: 10MB
      max-request-size: 100MB

spring:

  # 共享配置通道：把 smartview-infra/.env 注入 Spring Boot Environment。
  #
  # 为什么必须显式声明：Spring Boot 不认 .env 格式——那是 Docker Compose / shell 的约定，
  # 不是 Java 生态的。Python 侧靠 app/core/config.py 的 load_dotenv 自行加载，
  # Java 侧此前没有任何对应机制，导致下面所有 ${VAR:default} 全部走回退默认值；
  # 而回退值恰好与 .env 逐字节相同，所以这个缺陷长期不可见。
  #
  # [.properties] 是必需的扩展名提示：.env 不在 Spring 的已知扩展名（properties/yml/yaml）
  # 之内，没有提示会直接报 "Unable to load config data"。本 .env 的写法保证可被 properties
  # 语法正确解析：纯 KEY=value、注释独占一行、无引号、无 export 前缀、无 $ 插值、无反斜杠转义。
  # 若将来往 .env 里写带引号或空格的取值，会与本解析器产生差异（Compose 支持、properties 不完全等价）。
  #
  # optional: 前缀是有意为之：文件缺失时跳过而不是报错。新克隆的仓库没有 .env（已被 .gitignore 忽略），
  # 此时应当继续走到"JWT_SECRET 为空 → 启动失败并给出明确的配置错误"，
  # 而不是含糊的"配置文件找不到"。
  #
  # 两个路径分别覆盖两种真实工作目录：mvn spring-boot:run 与 IDEA 默认都在 smartview-server/ 下
  # 运行（用 ../），从仓库根执行时命中后者。
  # 注意路径按进程当前工作目录解析，因此 `java -jar` 这类打包运行方式不受这两个相对路径保护：
  # 在仓库根或 smartview-server/ 下执行才会命中，其它目录请用 SPRING_CONFIG_IMPORT 显式指定
  # （见 docs/local-development.md 的「打包运行」）。
  # 另外，本项目的 CI（.github/workflows/ci.yml 的 backend job）走的不是这条通道：
  # 它使用 application-test.yml 并在 workflow 里注入所需环境变量，与本地开发互不影响。
  config:
    import:
      - optional:file:../smartview-infra/.env[.properties]
      - optional:file:smartview-infra/.env[.properties]

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
      file-size-threshold: 0
  application:
    name: smartview-server
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/smartview?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:123456}
  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    # 如果数据库非空且没有 flyway_schema_history 表，则自动创建基线版本
    baseline-on-migrate: true
    # 迁移脚本存放位置
    locations: classpath:db/migration
    # 基线版本号，用于已有数据库的初始化
    baseline-version: 0
    # 迁移脚本文件编码
    encoding: UTF-8
    # 校验已应用的迁移脚本是否被修改（生产环境建议开启）
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:smartview}
    password: ${RABBITMQ_DEFAULT_PASS:123456}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:smartview}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  # 全局逻辑删除配置
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑未删除值（默认值）
      logic-not-delete-value: 0
      # 逻辑已删除值
      logic-delete-value: 1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

smartview:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:smartview}
    secret-key: ${MINIO_ROOT_PASSWORD:12345678}
    bucket: ${MINIO_BUCKET:smartview}
  jwt:
    # 签名密钥禁止提供可预测回退值：未配置时占位符解析为空串，
    # 由 JwtProperties 的 @NotBlank 在启动阶段直接失败，
    # 避免部署环境漏配时用公开密钥签发可被伪造的 Token。
    # 本地开发的真实密钥来自 smartview-infra/.env（见文件头 spring.config.import 通道）。
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:smartview}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:7200}
  resume:
    # 简历文件上传配置
    max-file-size: ${RESUME_MAX_FILE_SIZE:10485760}  # 10MB
    allowed-mime-types: ${RESUME_ALLOWED_MIME_TYPES:application/pdf}
    mq:
      # MQ 投递配置
      max-retry-attempts: ${RESUME_MQ_MAX_RETRY_ATTEMPTS:3}
      retry-base-delay-ms: ${RESUME_MQ_RETRY_BASE_DELAY_MS:100}
      scheduled-retry-interval-minutes: ${RESUME_MQ_SCHEDULED_RETRY_INTERVAL_MINUTES:5}
      max-scheduled-retry-count: ${RESUME_MQ_MAX_SCHEDULED_RETRY_COUNT:3}
  ai-service:
    # FastAPI AI 服务同步调用配置（首题生成等需要同步返回的轻量接口）
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    # 跨服务鉴权密钥，与 smartview-ai 的 AI_SERVICE_API_KEY 保持一致
    api-key: ${AI_SERVICE_API_KEY:smart-view}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:60000}
